services:
  - type: web
    name: vehicle-health-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: MODEL_DIR
        value: ./drive-download-20260820T190522Z-1-001
      - key: DATASET_PATH
        value: ./flex_fuel_predictive_maintenance_dataset_augmented.csv
      - key: DATABASE_URL
        fromDatabase:
          name: vehicle-health-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://vehicle-health-ui.onrender.com
      - key: FRONTEND_URL
        value: https://vehicle-health-ui.onrender.com
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: vehicle-health-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vehicle-health-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: vehicle-health-db
    plan: free
    databaseName: vehicle_health
    user: vehicle